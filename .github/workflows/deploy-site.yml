name: Deploy Site

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true

      - run: corepack pnpm install
      - name: Build site
        run: corepack pnpm build

      - name: 'Deploy'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: build/
